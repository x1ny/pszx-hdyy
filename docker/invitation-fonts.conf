<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    accept 会把候选字体追加到原 family 后面，因此每条规则都是一条有序链：

      完整原字体 -> 同类微软字体 -> 相近中文字体 -> Noto CJK

    例如“方正小标宋简体”会按 SimSun -> Noto Serif CJK SC 查找；
    “仿宋”会按 FangSong -> SimSun -> Noto Serif CJK SC 查找。
    原字体存在时不会被强行替换；没有授权的字体不放进镜像即可自动走平替链。

    PDF 转换副本会移除 DOCX 内嵌的子集字体引用，让这里的完整字体或兜底
    字体真正接管，避免模板内嵌子集缺少新姓名中的字。
  -->

  <!-- Microsoft 简体中文：宋体 / 仿宋 / 楷体 -->
  <alias><family>宋体</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>新宋体</family><accept><family>NSimSun</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>SimSun</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>NSimSun</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>仿宋</family><accept><family>FangSong</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>FangSong</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <!-- 仿宋_GB2312 / 楷体_GB2312 等兼容名在下方用 match 保证候选顺序。 -->
  <alias><family>楷体</family><accept><family>KaiTi</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>KaiTi</family><accept><family>Noto Serif CJK SC</family></accept></alias>

  <!-- Microsoft 简体中文：黑体 / 微软雅黑 / 等线 -->
  <alias><family>SimHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>黑体</family><accept><family>SimHei</family><family>Microsoft YaHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>微软雅黑</family><accept><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>微软雅黑 UI</family><accept><family>Microsoft YaHei UI</family><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Microsoft YaHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Microsoft YaHei UI</family><accept><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>等线</family><accept><family>DengXian</family><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>DengXian</family><accept><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>DengXian Light</family><accept><family>DengXian</family><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>DengXian Bold</family><accept><family>DengXian</family><family>Microsoft YaHei</family><family>SimHei</family><family>Noto Sans CJK SC</family></accept></alias>

  <!-- Microsoft 繁体中文及其他常见中文名称 -->
  <alias><family>Microsoft JhengHei</family><accept><family>SimHei</family><family>Microsoft YaHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Microsoft JhengHei UI</family><accept><family>Microsoft JhengHei</family><family>SimHei</family><family>Microsoft YaHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>微软正黑</family><accept><family>Microsoft JhengHei</family><family>SimHei</family><family>Microsoft YaHei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>MingLiU</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>PMingLiU</family><accept><family>MingLiU</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>MingLiU_HKSCS</family><accept><family>MingLiU</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>细明体</family><accept><family>MingLiU</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>新細明體</family><accept><family>PMingLiU</family><family>MingLiU</family><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>

  <!-- macOS / Office 常见中文名称 -->
  <alias><family>STSong</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>Songti SC</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>华文宋体</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>华文中宋</family><accept><family>SimSun</family><family>Noto Serif CJK SC</family></accept></alias>
  <!-- 这些兼容名使用显式 match，避免 alias 嵌套时跳过第一候选。 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FangSong</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>楷体_GB2312</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>DFKai-SB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>DFKai</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>标楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>STFangsong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FangSong</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>华文仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FangSong</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>STKaiti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Kaiti SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>华文楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>STHeiti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Heiti SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>华文黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!--
    模板中的商业字体：使用 pattern match + assign 强制改写 family。
    这和 alias 不同：不会把未授权的原 family 留在候选列表里，避免运行环境
    偶然装有方正字体时被误用。每个 match 仍保留有序候选：相似微软字体、
    相近中文字体、Noto。若业务取得授权，应移除对应 match，再把完整字体
    作为明确的部署依赖管理。
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>方正小标宋简体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>FZXiaoBiaoSong-B05S</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>FZXiaoBiaoSong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>方正小标宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>方正仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FangSong</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>方正楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>KaiTi</string></edit>
    <edit name="family" mode="append" binding="strong"><string>SimSun</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>方正黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SimHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Microsoft YaHei</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>
