<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- accept 排在原字体之后：已安装的完整原字体优先，缺失时使用镜像内的思源系中文字体。 -->
  <alias><family>宋体</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>SimSun</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>仿宋</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>FangSong</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>仿宋_GB2312</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>方正小标宋简体</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>楷体</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>KaiTi</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>黑体</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>SimHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
</fontconfig>
