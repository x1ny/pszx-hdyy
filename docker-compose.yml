# 固定 project 名。不写的话 compose 按**目录名**派生 project，于是每个
# worktree 各建一个 postgres 容器去抢 5432 —— 抢输的那些不发布端口却继续跑，
# 卷也一路堆积（这个仓库真出现过 4 个容器 / 5 个孤儿卷）。写死之后所有
# worktree 共用同一个持久库，这也正是 `bun run dev:persist` 的语义。
#
# 默认的 `bun run dev` 不走这个文件，它每个 worktree 起一次性的 tmpfs 容器
# （见 scripts/dev-db.ts）。
name: pszx-hdyy

services:
  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice
    profiles: [pdf]
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=180s
      - --api-body-limit=510MB
      - --libreoffice-auto-start=true
      - --libreoffice-max-queue-size=4
      - --libreoffice-deny-private-ips=true
      - --libreoffice-deny-public-ips=true
      - --api-disable-download-from=true
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3030}:3000"
    volumes:
      - ./docker/fonts:/usr/local/share/fonts/custom:ro
      - ./docker/invitation-fonts.conf:/etc/fonts/conf.d/99-invitation.conf:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack_template
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
