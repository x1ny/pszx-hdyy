<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>消息发送记录</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body><div class="page-shell"><aside class="side-nav"></aside><main class="main"><header class="topbar"><div><b>消息发送记录</b><br><small>系统记录查询</small></div><span data-role-label></span></header><section class="content">
<div class="page-title"><div><div class="breadcrumb">系统管理 / 消息发送记录</div><h1>消息发送记录</h1><p>发送动作从报名、邀请函、排位、资源等业务页面发起；本页用于查询系统记录和失败原因。</p></div><a class="btn" href="message-templates.html">消息规则</a></div>
<div class="panel"><div class="panel-head"><h2>查询条件</h2><div class="toolbar"><button class="btn">重置</button><button class="btn primary">查询</button></div></div><div class="panel-body filters"><div class="field"><label>消息类型</label><select class="select"><option>全部</option><option>邀请函提醒</option><option>座位通知</option><option>报名审核通过</option></select></div><div class="field"><label>发送状态</label><select class="select"><option>全部</option><option>待发送</option><option>发送成功</option><option>发送失败</option></select></div><div class="field"><label>业务对象</label><input class="input" value="主论坛"></div><div class="field"><label>时间</label><input class="input" type="date"></div></div></div>
